server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  tomcat:
    max-http-form-post-size: 8MB
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: skymetrics-platform
  mail:
    host: ${SKYMETRICS_SMTP_HOST:}
    port: ${SKYMETRICS_SMTP_PORT:587}
    username: ${SKYMETRICS_SMTP_USERNAME:}
    password: ${SKYMETRICS_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3309/apix_prototype?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:skymetrics}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
logging:
  level:
    org.hibernate.SQL: warn
