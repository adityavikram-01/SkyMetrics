services:
  - type: web
    name: skymetrics-current
    runtime: docker
    plan: free
    branch: deploy-current
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: COMMERCE_DB_URL
        sync: false
      - key: COMMERCE_DB_USERNAME
        sync: false
      - key: COMMERCE_DB_PASSWORD
        sync: false
      - key: SKYMETRICS_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SKYMETRICS_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
